server:
  port: 8088

spring:
  application:
    name: link-tap
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  mvc:
    servlet:
      request:
        characterEncoding: UTF-8
      response:
        characterEncoding: UTF-8
        charset: UTF-8

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
      location: ..\tap\src\main\resources\static\img\studentImg    #상점 메뉴판 이미지 저장 경로임

    multipart1:
      max-file-size: 20MB
      max-request-size: 100MB
      location: ..\tap\src\main\resources\static\img\shopImg         # 상점에 대한 이미지 저장 경로임

  # ?? ???
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  thymeleaf:
    enabled: true
    prefix: classpath:templates/
    suffix: .html
    cache: false

  ####################################
  # MySql Setting
  ####################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tap?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username : root
    password : 1234

  ####################################
  # JPA Setting
  ####################################
  jpa:
    open-in-view: true
    hibernate:
      ddl_auto: update #create, update, none, create_drop, validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format.sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

####################################
# Log Setting
####################################
logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

  security:
    user:
      name: test
      password: 1111

