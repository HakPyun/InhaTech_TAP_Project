<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">
<head>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/valid.js"></script>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <form action="/member/find/pw" th:object="${memberDTO}" method="post">
            <div class="container py-4">
                <div class="row align-items-center text-center justify-content-between">
                    <span class="text-dark h4">비밀번호 찾기</span>
                </div>
                <label for="mId" class="form-label mt-4">아이디</label>
                <input type="text" id="mId" name="member_id" class="form-control" th:field="*{member_id}">
            </div>
            <div class="container py-4">
                <label for="mName" class="form-label mt-4">이름</label>
                <input type="text" class="form-control" id="mName" name="member_name" th:field="*{member_name}">
            </div>
            <div class="container py-4">
                <label for="mTell" class="form-label mt-4">전화번호</label>
                <input type="text" class="form-control" oninput="autoHyphen2(this)" maxlength="13" placeholder="- 빼고 입력" id="mTell" name="member_phone" th:field="*{member_phone}">
            </div>
            <div class="container py-4">
                <label for="mStatus" class="form-label mt-4">질문</label>
                <select id="mStatus" name="member_status" class="form-select" th:field="*{member_status}">
                    <option value="중학교">내가 나온 중학교는?</option>
                    <option value="동네">내가 사는 동네는?</option>
                </select>
            </div>

            <div class="container py-4">
                <label for="mAnswer" class="form-label mt-4">답변</label>
                <input type="text" id="mAnswer" class="form-control" name="member_answer" th:field="*{member_answer}">
                <p th:if="${ErrorMsg}" class="fieldError" th:text="${ErrorMsg}"  ></p>

                <div class="d-grid gap-2 col-6 mx-auto">
                    <input type="submit"  class="btn btn-primary" value="확인">
                    <a href="/member/login" class="btn btn-primary">취소</a>
                </div>
            </div>
        </form>
    </section>

</div>
</html>
