<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/valid.js"></script>
</head>
<div layout:fragment="content">
    <section class="bg-light">

        <form action="/member/find/id" th:object="${memberDTO}" method="post">
            <div class="container py-4">
                <div class="row align-items-center text-center justify-content-between">
                    <span class="text-dark h4">아이디 찾기</span>
                </div>
                <label for="mName" class="form-label mt-4">이름</label>
                <input type="text" class="form-control" id="mName" name="member_name" th:field="*{member_name}">
            </div>
            <div class="container py-4">
                <label for="mTell" class="form-label mt-4">전화번호</label>
                <input type="text" class="form-control" oninput="autoHyphen2(this)" maxlength="13" placeholder="- 빼고 입력" id="mTell" name="member_phone" th:field="*{member_phone}">
            </div>
            <div class="container py-4">
                <div class="d-grid gap-2 col-6 mx-auto">
                    <p th:if="${ErrorMsg}" class="error" th:text="${ErrorMsg}"></p>
                    <input type="submit"  class="btn btn-primary" value="아이디 찾기">
                    <a href="/member/login" class="btn btn-primary">취소</a>
                </div>
            </div>
        </form>
    </section>
</div>

</html>
