<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">
<head>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/valid.js"></script>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
</head>
<div layout:fragment="content">
    <section class="bg-light">

        <form action="/member/find/id" th:object="${memberDTO}" method="post">
            <label>
                <input type="hidden" id="member_id" name="member_id" th:field="*{member_id}" readonly>
            </label>
            <div class="row align-items-center text-center justify-content-between">
                <span class="text-dark h4">비밀번호 재설정</span>
            </div>
            <div class="container py-4">
                <label for="member_pw" class="form-label mt-4">비밀번호</label>
                <input type="password"  class="form-control" id="member_pw" name="member_pw" >
            </div>
            <div class="container py-4">
                <label for="check_pw" class="form-label mt-4">비밀번호 확인</label>
                <input type="password" class="form-control"  id="check_pw" name="member_pw_check" >
                <p id="error-message" style="color: red;"></p>
            </div>
            <div class="container py-4">
                <div class="d-grid gap-2 col-6 mx-auto">
                    <input type="button" onclick="validatePassword()" class="btn btn-primary" value="재설정하기">
                    <a href="/member/login" class="btn btn-primary">취소</a>
                </div>
            </div>
        </form>
    </section>

</div>
</html>
