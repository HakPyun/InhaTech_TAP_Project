<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>등록</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="/js/kakaoAddr.js"></script>
    <!--    <script src="js/animation.js"></script>-->
    <!--    <script src="jquery-1.7.1.min.js"></script>-->
    <script th:src="@{/js/menuInsDel.js}"></script>
    <link rel="stylesheet" href="css/style.css">
    <th:block layout:fragment="script">

        <script th:inline="javascript">
            $(document).ready(function(){
              var errorMessage = [[${errorMessage}]];
              if(errorMessage != null){
                  alert(errorMessage);
              }

              bindDomEvent();

          });

          function bindDomEvent(){
              $(".custom-file-input").on("change", function() {
                  var fileName = $(this).val().split("\\").pop();  //이미지 파일명
                  var fileExt = fileName.substring(fileName.lastIndexOf(".")+1); // 확장자 추출
                  fileExt = fileExt.toLowerCase(); //소문자 변환

                  if(fileExt != "jpg" && fileExt != "jpeg" && fileExt != "gif" && fileExt != "png" && fileExt != "bmp"){
                      alert("이미지 파일만 등록이 가능합니다.");
                      return;
                  }

                  $(this).siblings(".custom-file-label").html(fileName);
              });
          }
    const autoHyphen2 = (target) => {
        target.value = target.value
       .replace(/[^0-9]/g, '')
      .replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3").replace(/(\-{1,2})$/g, "");
        }

        </script>

    </th:block>
</head>


<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
    <style>
        .input-group {
            margin-bottom : 15px
        }
        .img-div {
            margin-bottom : 10px
        }
        .fieldError {
            color: red;

        }
    </style>
</th:block>

<div layout:fragment="content">

                <div class="input-group">

                    </div>

                <p th:if="${sNameErrorMsg}"  th:text="${sNameErrorMsg}" class="fieldError"></p><br>

                </div><br>

                    </div>
                </div>

                </div><br>

                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">상세주소</span>
                    </div>

                <div class="input-group">

                    </div>
                </div>

                <p th:if="${#fields.hasErrors('sTell')}" th:errors="*{sTell}" class="fieldError">Incorrect data</p><br>

                    <div class="input-group-prepend">
                        <span class="input-group-text">운영 시간</span>
                    </div>
                    <div class="container">
                        <input type="time" name="shop_start_time" th:value="${hour.sTime}" >부터
                        <input type="time" name="shop_end_time" th:value="${hour.eTime}">까지
                    </div>
                </div><br>

                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">쉬는 시간 (※쉬는 시간이 있는 경우만)</span>
                    </div>
                    <div class="container">
                        <input type="time" name="breakTimeStart" th:field="*{breakSTime}">부터
                        <input type="time" name="breakTimeEnd" th:field="*{breakETime}">까지
                    </div>
                </div><br>

                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">휴무일 (※중복 선택 가능)</span>
                    </div>
                    <div class="input-group d-flex justify-content-center">
                        <div>
                            <input type="checkbox" class="btn-check" name="dayOff" id="allDayOpen" value="없음" th:checked="${hour.sDay eq '없음'}">
                            <label class="btn btn-outline-danger" for="allDayOpen">없음</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="monday" value="월요일" th:checked="${hour.sDay eq '월요일'}">
                            <label class="btn btn-outline-danger" for="monday">월요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="tuesday" value="화요일" th:checked="${hour.sDay eq '화요일'}">
                            <label class="btn btn-outline-danger" for="tuesday">화요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="wednesday" value="수요일" th:checked="${hour.sDay eq '수요일'}">
                            <label class="btn btn-outline-danger" for="wednesday">수요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="thursday" value="목요일" th:checked="${hour.sDay eq '목요알'}">
                            <label class="btn btn-outline-danger" for="thursday">목요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="friday" value="금요일" th:checked="${hour.sDay eq '금요일/'}">
                            <label class="btn btn-outline-danger" for="friday">금요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="saturday" value="토요일" th:checked="${hour.sDay eq '토요일'||hour.sDay eq '주말'}">
                            <label class="btn btn-outline-danger"c for="saturday">토요일</label>
                            <input type="checkbox" class="btn-check" name="dayOff" id="sunday" value="일요일" th:checked="${hour.sDay eq '일요일'||hour.sDay eq '주말'}">

                        </div>
                    </div>

                    </div>
                </div>
                <input type="text" th:field="*{bhSignificant}" class="form-control" placeholder="ex)공휴일 쉽니다.">
                <p th:if="${#fields.hasErrors('bhSignificant')}" th:errors="*{bhSignificant}" class="fieldError">Incorrect data</p><br>

                <div class="table-responsive"><!------------------------------------메뉴 넣는 곳---------------------------------------------------------------->
                    <table class="table caption-top" id="menuTable" >
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">메뉴</span>
                            </div>
                        </div>

                            <th scope="col">비고</th>

                        </thead>

                </div><br>

                    </div>

                            <!--                  <label class="custom-file-label"  hidden="hidden"  th:text="${not #strings.isEmpty(shopImgDto.shop_oriImgName)} ? ${shopImgDto.shop_oriImgName} : '메뉴판이미지' + ${status.index+1}"></label>-->

                <div  style="text-align: center" class="d-grid gap-2 col-6 mx-auto">
                    <button  type="submit" class="btn btn-primary">수정</button><br>
                </div>
            </div>
        </form>
    </section>
</div>
</html>
