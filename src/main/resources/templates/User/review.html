<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"

>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.js"></script>
    <script th:src="@{/assets/js/scripts.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block layout:fragment="script">

        <script th:inline="javascript">
            $(document).ready(function(){
                let errorMessage = [[${errorMessage}]];  // [[${errorMessage}]] : 변수 내용 출력
                if(errorMessage != null){
                    alert(errorMessage);
                }

            });
        </script>
    </th:block>
</head>

<div layout:fragment="content" >
    <section id="counts" class="counts" style="background-color: #FFFFFF;">
        <div class="container py-10">
            <div class="row align-items-center text-center justify-content-between" style="margin-top:100px; margin-bottom:100px;">
                <h1 style="font-weight: bold;"><span class="text-dark" >후기 작성하기</span></h1>
            </div>
            <form action="/review/save"  accept-charset="UTF-8"method="post"  enctype="multipart/form-data" >
                <input type="hidden" th:value="${sId}" name="sId" >
                <div class="star-rating space-x-4 mx-auto">
                    <input type="radio" id="5-stars" name="uScore" value=5.0 v-model="ratings"/>
                    <label for="5-stars" class="star pr-4">★</label>
                    <input type="radio" id="4-stars" name="uScore" value=4.0 v-model="ratings"/>
                    <label for="4-stars" class="star">★</label>
                    <input type="radio" id="3-stars" name="uScore" value=3.0 v-model="ratings"/>
                    <label for="3-stars" class="star">★</label>
                    <input type="radio" id="2-stars" name="uScore" value=2.0 v-model="ratings"/>
                    <label for="2-stars" class="star">★</label>
                    <input type="radio" id="1-star" name="uScore" value=1.0 v-model="ratings" />
                    <label for="1-star" class="star">★</label>
                </div>
                <div >
                    <input type="file" id="fileInput" name="file">

                </div>
                <div class="form-group" style="margin-top:60px">
                    <h3 style="font-weight: bold;">후기 작성</h3>
                    <textarea class="form-control" name="uReview" rows="5" placeholder="Message" ></textarea>

                </div>
                <div class="row"style="margin-top:100px;">
                    <div class="col form-group" style="text-align:right;">
                        <button  type="submit" class="btn btn-primary">저장</button>
<!--                        <input type="submit" value="확인">-->
                    </div>
                    <div class="col form-group" style="text-align:left;">
                        <a class="btn btn-primary" th:href="@{|/shop/*{sName}|}">취소</a>
                        <!--                        <input type="button" value="취소">-->
                    </div>
                </div>

            </form>
        </div>



    </section>






</div>
</html>
