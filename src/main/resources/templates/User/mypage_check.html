<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 확인</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .fieldError {
        color: red;
    }
        .bg-light{
            height: 1053px;
            padding-top:55px;
            padding-bottom:75px;
        }
        .flex-fill.mx-xl-5.mb-2{
            margin: 0 auto;
            width : 700px;
            padding-right: 7rem;
            padding-left: 7rem;
        }

        .container.py-4{
            margin: 0 auto;
            width : 503px;
        }

        .d-grid.gap-2{
            padding-top: 10px;
        }


  </style>
</head>
<div layout:fragment="content">
  <section class="bg-light">

    <form action="/mypage/check" th:object="${memberDTO}"method="post">
      <div class="container py-4">
        <label th:for="member_pw">비밀번호</label>
        <input type="password" class="form-control" name=member_pw><br>
        <p th:if="${ErrorMsg}" class="error" th:text="${ErrorMsg}"></p>
      </div>
      <div class="container py-4">
        <div class="d-grid gap-2 col-6 mx-auto">
          <input type="submit" class="btn btn-primary" value="확인">
          <a href="/" class="btn btn-primary">취소</a>
        </div>
      </div>
    </form>
  </section>
</div>

</html>
