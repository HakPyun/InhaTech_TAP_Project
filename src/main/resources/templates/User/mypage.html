<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
    <link rel="stylesheet" href="css/style.css">
    <script th:src="@{/js/user.js}"></script>
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <form action="/mypage/update" th:object="${memberDTO}" method="post">
        <div class="container py-4">
            <div class="row align-items-center text-center justify-content-between">
                <span class="text-dark h4">마이 페이지</span>
            </div>
            <label for="mName" class="form-label mt-4">이름</label>
            <input type="text" id="mName" name="member_name" class="form-control" th:field="*{member_name}" readonly><br>

            <label for="mId" class="form-label mt-4">아이디</label>
            <input type="text" id="mId" class="form-control" readonly name="member_id" th:field="*{member_id}" >

            <label for="mNickname" class="form-label mt-4">닉네임</label>
            <div class="row">
                <div class="col">
                    <input type="text" id="mNickname"  class="form-control" name="member_nickname" th:field="*{member_nickname}">
                </div>
                <div class="col">
                    <input type="button" id="NickBtn" onclick="check_nickname()" class="btn btn-info" value="중복체크">
                </div>
            </div>
            <p th:if="${#fields.hasErrors('member_nickname')}" th:errors="*{member_nickname}" class="fieldError">Incorrect data</p>
            <p id="nick-error-message" name="nick_error" style="color: red;"></p>

            <label for="mTell" class="form-label mt-4">전화번호</label>
            <input type="text" oninput="autoHyphen2(this)" maxlength="13" class="form-control"  placeholder="전화번호를 입력해보세요!" id="mTell" name="member_phone" th:field="*{member_phone}"><br>
            <p id="phone-error-message" name="phone_error"style="color: red;"></p><br>

            <label for="mRole" class="form-label mt-4">직책</label>
            <input type="text" id="mRole" name="member_Role"  class="form-control" th:field="*{member_Role}" readonly><br>

            <div class="d-grid gap-2 col-6 mx-auto">
                <a href="/member/update/pw" class="btn btn-primary" >비밀번호 변경하기</a><br>
            </div>
            <label for="mStatus" class="form-label mt-4">비밀번호 찾기 질문</label>
            <select id="mStatus" name="member_status" class="form-select" th:field="*{member_status}">
                <option value="중학교">내가 나온 중학교는?</option>
                <option value="동네">내가 사는 동네는?</option>
            </select>

            <label for="mAnswer" class="form-label mt-4">답변</label>
            <input type="text" id="mAnswer" class="form-control" name="member_answer" th:field="*{member_answer}">
            <p th:if="${#fields.hasErrors('member_answer')}" th:errors="*{member_answer}" class="fieldError">Incorrect data</p>

            <label for="mRegister" sec:authorize="hasAnyAuthority('ROLE_USER')">등록자 신청현황</label>
            <input type="text" id="mRegister" name="admin_check_code" sec:authorize="hasAnyAuthority('ROLE_USER')" th:field="*{admin_check_code}" readonly class="form-control"><br>
            <a href="/member/register/editor"  sec:authorize="hasAnyAuthority('ROLE_USER')" class="btn btn-primary">등록자 신청하기</a><br>
            <div class="d-grid gap-2 col-6 mx-auto">
                <input type="button"  class="btn btn-danger" onclick="deleteMember()" value="회원탈퇴">
                <input type="button" id="update_btn" onclick="update_member()" value="수정하기" class="btn btn-primary">
                <a href="/" class="btn btn-primary">취소</a><br>
            </div>
        </div>
        </form>
    </section>
</div>

</html>
