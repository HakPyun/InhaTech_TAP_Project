<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">
<head>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/user.js"></script>
    <meta charset="UTF-8">
    <title>TAP</title>
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <div class="container py-4">
            <div class="row align-items-center text-center justify-content-between">
                <span class="text-dark h4">비밀번호 재설정</span>
            </div>
            <label for="member_pw">비밀번호 재설정</label><br>
            <input type="password"  class="form-control" id="member_pw" name="member_pw" ><br>
            <label for="check_pw">비밀번호 확인:</label><br>
            <input type="password" class="form-control"  id="check_pw" name="member_pw_check" ><br>
            <p id="error-message" style="color: red;"></p>
            <div class="d-grid gap-2 col-6 mx-auto">
            <input type="button" class="btn btn-primary" onclick="validatePassword()" value="재설정하기">
            <a href="/mypage" class="btn btn-primary">취소</a><a id="result_message"></a>
            </div>
        </div>
    </section>
</div>
</html>
