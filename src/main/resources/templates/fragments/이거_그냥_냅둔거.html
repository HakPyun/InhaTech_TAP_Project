<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">

<div th:fragment="header">

    <nav class="navbar bg-body-tertiary fixed-top" >
        <div class="container-fluid">
            <div class="d-flex">
                <a  class="btn btn-outline-success"  sec:authorize="isAuthenticated()" th:href="@{/mypage/check}" ><span th:text="${userNickname}"></span></a>
                <a class="btn btn-outline-success"  sec:authorize="isAnonymous()" href="/member/login">로그인</a>

            </div>
            <a class="navbar-brand" href="/">TAP</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">TAP</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="btn btn-outline-success"  sec:authorize="isAuthenticated()" href="/logout">로그아웃</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/">이용안내</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/example">소개</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/map">지도</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()" >
                            <a class="nav-link active" aria-current="page" href="/mypage">마이페이지</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link active" aria-current="page"  href="/member/save">회원가입</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_EDITOR')">
                            <a class="nav-link active" aria-current="page"  href="/shopregist">등록</a>
                        </li>

                        </li>
                        <li class="nav-item"  sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_EDITOR')">
                            <a class="nav-link active" aria-current="page" href="/shop/myShopList">나의 가게 리스트</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                            <a class="nav-link active" aria-current="page" href="/admin/editor/check/list">등록자 신청 목록</a>
                        </li>
                        <li class="nav-item"  sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                            <a class="nav-link active" aria-current="page" href="/admin/member/list">회원 관리</a>
                        </li>
                    </ul>

                </div>
            </div>
        </div>
    </nav>
</div>

</html>
