<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/Admin.js"></script>
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <form action="/admin/member/update" th:object="${memberDTO}" method="post">
        <div class="container py-4">
        <div class="row align-items-center text-center justify-content-between">
            <span class="text-dark h4">세부사항</span>
        </div>

            <label for="mId" class="form-label mt-4">아이디</label>
            <input type="text" id="mId" class="form-control" readonly name="member_id" th:field="*{member_id}"  >


            <label for="mName" class="form-label mt-4">이름</label>
            <input type="text" id="mName" name="member_name"  class="form-control" th:field="*{member_name}" readonly><br>


            <label for="mTell" class="form-label mt-4">전화번호</label>
            <input type="text" oninput="autoHyphen2(this)"  readonly maxlength="13" class="form-control"  placeholder="전화번호를 입력해보세요!" id="mTell" name="member_phone" th:field="*{member_phone}"><br>
            <label for="mTell">직책</label><br>
                <select  class="form-select" id="mRole"name="member_Role" th:field="*{member_Role}">
                <option value="USER">일반</option>
                <option value="EDITOR">등록자</option>
                </select>
        <input type="button" class="btn btn-danger" onclick="deleteMember()" value="삭제하기">

        <input type="button" onclick="updateMember()" class="btn btn-primary" value="수정하기">
        <a href="/admin/member/list">취소</a>
            <div>
                <table class="table caption-top">
                    <caption>가게 리스트</caption>
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">이름</th>
                        <th scope="col">본 주소</th>
                        <th scope="col">부 주소</th>
                        <th scope="col">조회</th>
                        <th scope="col">삭제</th>
                    </tr>
                    </thead>
                    <tr th:each="value: ${ShopList}" scope="row" >
                        <td th:text="${value.sName}"></td>
                        <td th:text="${value.sAddrMain}"></td>
                        <td th:text="${value.sAddrSub}"></td>
                        <td><a th:href="@{|/info/shop/${value.sName}|}" class="btn btn-primary">조회</a></td>
                        <td><input type="button" value="삭제"></td>

                    </tr>

                </table>
            </div>
        </div>
    </form>

    </section>
</div>

</html>
