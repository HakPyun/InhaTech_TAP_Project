<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
    <link rel="stylesheet" href="css/style.css">
</head>
<div layout:fragment="content">
    <section id="counts" class="counts" style="background-color: #FFFFFF;">
        <div class="container py-10">

    <table class="table caption-top">
        <caption>전체 리스트</caption>
        <thead class="table-dark">
        <tr>
            <th scope="col">아이디</th>
            <th scope="col">이름</th>
            <th scope="col">직급</th>
            <th scope="col">조회</th>
        </tr>
        </thead>
        <tr th:each="member: ${memberList}" scope="row" >
            <td th:text="${member.member_id}"></td>
            <td th:text="${member.member_name}"></td>
            <td th:text="${member.member_Role}"></td>
            <td><a th:href="@{|/admin/member/list/${member.member_id}|}">조회</a></td>

        </tr>

    </table>
        </div>
    </section>
</div>

</html>
