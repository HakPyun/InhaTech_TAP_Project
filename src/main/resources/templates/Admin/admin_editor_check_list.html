<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <div class="container py-6">
    <table class="table caption-top">
        <caption>등록자 신청 리스트</caption>
        <thead class="table-dark">
        <tr>
            <th>id</th>
            <th>name</th>
            <th>answer</th>
            <th>조회</th>
        </tr>
        </thead>
        <tr th:each="memberEntity: ${memberList}">
            <td th:text="${memberEntity.member_id}"></td>
            <td th:text="${memberEntity.member_name}"></td>
            <td th:text="${memberEntity.admin_check_code}"></td>
            <td><a th:href="@{|/admin/editor/check/${memberEntity.member_id}|}">조회</a></td>

        </tr>

    </table>
        </div>
    </section>
</div>

</html>
