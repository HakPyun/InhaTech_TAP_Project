<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
>
<head>
    <script src="/js/Admin.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<div layout:fragment="content">
    <section class="bg-light">
        <div class="container py-4">
            <div class="row align-items-center text-center justify-content-between">
                <span class="text-dark h4">등록자 신청 세부사항</span>
            </div>
    <form action="/member/save" th:object="${memberDTO}" method="post">
        <div class="form-group">
        <!--    name 속성:서버로 전송할 때 변수이름 역할-->
        <label for="mName" class="form-label mt-4">이름</label>
        <input type="text" id="mName" class="form-control"name="member_name" th:field="*{member_name}"> <br>
        <label for="mId" class="form-label mt-4">아이디</label>
        <input type="text" id="mId" class="form-control"  name="member_id" th:field="*{member_id}" ><br>


        <label for="mTell" class="form-label mt-4">전화번호</label>
        <input type="text" id="mTell" name="member_phone" th:field="*{member_phone}">

            <div class="d-grid gap-2 col-6 mx-auto">
        <input type="button" class="btn btn-primary btn-lg" onclick="updateMemberRank()" value="확인">
        <a href="/admin/check/list" class="btn btn-primary btn-lg">취소</a>
        </div>
        </div>
    </form>
        </div>
    </section>
</div>

</html>
